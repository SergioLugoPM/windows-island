[package]
name = "halow"
version = "0.3.0"
edition = "2021"

[lib]
name = "windows_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri       = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = { version = "2.0", features = ["rustls-tls"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
reqwest     = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
chrono      = "0.4"
thiserror   = "1.0"
urlencoding = "2"
# System metrics (CPU, RAM, network, disk). components/users disabled to slim deps.
sysinfo     = { version = "0.32", default-features = false, features = ["system", "network", "disk"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Media_Control",
    "Foundation",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
] }
# Note: DWM (Mica) calls use raw FFI in lib.rs to avoid windows-crate version conflicts

[profile.release]
opt-level  = "s"
lto        = true
strip      = true
